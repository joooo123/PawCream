services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawcream
      POSTGRES_USER: pawcream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pawcream-postgres:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawcream -d pawcream"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pawcream-internal

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://pawcream:${POSTGRES_PASSWORD}@db:5432/pawcream
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - pawcream-internal

volumes:
  pawcream-postgres:

networks:
  pawcream-internal:
    driver: bridge
