name: Process Two Instax Transparent Assets

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/process-two-instax-transparent.py'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --upgrade pillow numpy opencv-python-headless

      - name: Convert large black photo areas to transparency
        run: python scripts/process-two-instax-transparent.py

      - name: Commit generated PNG files
        shell: bash
        run: |
          git add public/assets/instax-transparent/粉蓝正方形.png
          git add public/assets/instax-transparent/黄咖正方形两格.png
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add transparent variants for new Instax frames"
          git push
