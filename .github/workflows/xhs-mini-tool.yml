name: XHS mini-tool official skill check

on:
  push:
    branches:
      - feat/xiaohongshu-mini-tool
  workflow_dispatch:

permissions:
  contents: write

jobs:
  official-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact official 1.7.0 skill
        run: |
          set -euo pipefail
          mkdir -p .skill
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://fe-static.xhscdn.com/minitool/20260923133933/minitool-zip-builder-1.7.0.skill' \
            -o "$RUNNER_TEMP/minitool-zip-builder-1.7.0.skill"
          file "$RUNNER_TEMP/minitool-zip-builder-1.7.0.skill"
          sha256sum "$RUNNER_TEMP/minitool-zip-builder-1.7.0.skill"
          unzip -t "$RUNNER_TEMP/minitool-zip-builder-1.7.0.skill" | tail -4
      - name: Inspect official instructions
        run: |
          set -euo pipefail
          unzip -oq "$RUNNER_TEMP/minitool-zip-builder-1.7.0.skill" -d .skill
          find .skill -maxdepth 4 -type f | sort | head -80
          SKILL_FILE="$(find .skill -name SKILL.md -type f | head -1)"
          test -n "$SKILL_FILE"
          echo "OFFICIAL_SKILL_FILE=$SKILL_FILE"
          cat "$SKILL_FILE"
      - name: Preserve extracted official skill on dedicated branch
        run: |
          set -euo pipefail
          cat > .skill/OFFICIAL_SKILL_SOURCE.md <<'EOF'
          # 小红书小工具 Skill 原包来源
          
          - 下载地址：https://fe-static.xhscdn.com/minitool/20260923133933/minitool-zip-builder-1.7.0.skill
          - SHA-256：8bd0f4fde976ec3e9784bebc9fd8d16270769c129b39098698fc58572716c305
          - 压缩文件名版本：1.7.0
          - 包内 SKILL.md metadata.version：1.6.0
          - 下载与解压环境：GitHub Actions Ubuntu Runner
          - 本文件只记录下载结果；SDK 真机兼容性需要额外验证。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .skill/minitool-zip-builder .skill/OFFICIAL_SKILL_SOURCE.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(xhs): install official minitool skill and record source hash"
            git push origin "HEAD:refs/heads/feat/xiaohongshu-mini-tool"
          fi
      - name: Install WebP optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          command -v cwebp
      - name: Install original PawCream React build dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @babel/core @babel/preset-env playwright
          python3 -m pip install --disable-pip-version-check fonttools brotli
          python3 scripts/convert-fonts.py
      - name: Build, audit, and package mini-tool
        run: |
          set -euo pipefail
          node xhs-mini-tool/build-original-mobile.mjs
          unzip -t xhs-mini-tool/release/pawcream-xhs-mini-tool.zip | tail -3
          test -s xhs-mini-tool/release/validation-summary.json
      - name: Mobile Chrome screenshots and runtime smoke tests
        run: |
          set -euo pipefail
          command -v google-chrome
          node xhs-mini-tool/smoke-original.mjs
          test -s xhs-mini-tool/release/browser-smoke.json
      - name: Upload deliverable ZIP and validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawcream-xhs-mini-tool
          path: |
            xhs-mini-tool/release/pawcream-xhs-mini-tool.zip
            xhs-mini-tool/release/validation-summary.json
            xhs-mini-tool/release/browser-smoke.json
            xhs-mini-tool/release/mobile-home.png
            xhs-mini-tool/release/mobile-atelier.png
          if-no-files-found: warn
          retention-days: 30
