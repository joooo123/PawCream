name: Process Pink White Wide Instax

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/process-pink-white-wide-instax.py'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --upgrade pillow numpy opencv-python-headless

      - name: Convert black photo area to transparency
        run: python scripts/process-pink-white-wide-instax.py

      - name: Commit generated PNG
        shell: bash
        run: |
          git add "public/assets/instax-transparent/粉白横.png"
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add transparent pink-white wide Instax frame"
          git push
