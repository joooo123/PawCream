name: Process Instax Transparency

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/process-instax-transparent.py'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --upgrade pillow numpy opencv-python-headless

      - name: Make black photo areas transparent
        run: python scripts/process-instax-transparent.py

      - name: Commit generated PNG files
        shell: bash
        run: |
          if git diff --quiet -- public/assets/instax-transparent; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/instax-transparent
          git commit -m "Add transparent Instax assets"
          git push
