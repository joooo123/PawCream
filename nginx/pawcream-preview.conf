# PawCream pre-ICP internal-only preview.
# This is a STANDALONE Nginx configuration, not a system sites-enabled file.
# Only binds 127.0.0.1:8080 (not publicly reachable).
pid /run/nginx-pawcream-preview.pid;
worker_processes 1;
events {
    worker_connections 256;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/pawcream-preview-access.log;
    error_log /var/log/nginx/pawcream-preview-error.log warn;
    sendfile on;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        root /opt/pawcream/dist;
        index index.html;
        client_max_body_size 4m;

        location /api/ {
            proxy_pass http://127.0.0.1:8787/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
