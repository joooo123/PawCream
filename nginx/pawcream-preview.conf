# PawCream pre-ICP internal-only preview.
# This is a STANDALONE Nginx configuration, not a system sites-enabled file.
# Only binds loopback 127.0.0.1:8080 (HTTP) and :8443 (HTTPS).
# HTTP is for non-authenticated visual checks; HTTPS supports secure login cookies.
pid /run/nginx-pawcream-preview.pid;
worker_processes 1;
events {
    worker_connections 256;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/pawcream-preview-access.log;
    error_log /var/log/nginx/pawcream-preview-error.log warn;
    sendfile on;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        root /opt/pawcream/dist;
        index index.html;
        client_max_body_size 4m;

        location /api/ {
            proxy_pass http://127.0.0.1:8787/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }

    # Passwords and authenticated admin sessions should use this TLS-only
    # loopback endpoint, reached through the existing SSH tunnel.
    # Never bind this listener to 0.0.0.0 before ICP approval.
    server {
        listen 127.0.0.1:8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/pawcream-preview-cert.pem;
        ssl_certificate_key /etc/nginx/pawcream-preview-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /opt/pawcream/dist;
        index index.html;
        client_max_body_size 4m;

        location /api/ {
            proxy_pass http://127.0.0.1:8787/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Required for express-session secure cookies and origin checks.
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
