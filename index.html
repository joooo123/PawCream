<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdfb" />
    <script>
      try {
        if (sessionStorage.getItem('pawcream-splash-seen-v2') === '1') {
          document.documentElement.classList.add('pawcream-splash-seen')
        }
      } catch {}
    </script>
    <style>
      #pawcream-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 30% 34%, rgba(221, 240, 250, .76), transparent 34%),
          radial-gradient(circle at 72% 68%, rgba(247, 226, 236, .62), transparent 32%),
          #fffdfb;
        color: #6a8799;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 420ms ease, visibility 420ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      html.pawcream-splash-seen #pawcream-splash {
        display: none;
      }

      #pawcream-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .pawcream-splash__inner {
        width: min(310px, calc(100vw - 54px));
        text-align: center;
        transform: translateY(-2vh);
      }

      .pawcream-splash__paw {
        position: relative;
        width: 58px;
        height: 52px;
        margin: 0 auto 20px;
        animation: pawcream-splash-breathe 1.8s ease-in-out infinite;
      }

      .pawcream-splash__paw i {
        position: absolute;
        display: block;
        background: rgba(123, 163, 187, .72);
      }

      .pawcream-splash__paw i:nth-child(1) {
        left: 5px;
        top: 10px;
        width: 13px;
        height: 17px;
        border-radius: 52% 48% 52% 48%;
        transform: rotate(-24deg);
      }

      .pawcream-splash__paw i:nth-child(2) {
        left: 21px;
        top: 1px;
        width: 14px;
        height: 18px;
        border-radius: 52% 48% 52% 48%;
        transform: rotate(-7deg);
      }

      .pawcream-splash__paw i:nth-child(3) {
        right: 5px;
        top: 10px;
        width: 13px;
        height: 17px;
        border-radius: 48% 52% 48% 52%;
        transform: rotate(24deg);
      }

      .pawcream-splash__paw i:nth-child(4) {
        left: 14px;
        bottom: 1px;
        width: 31px;
        height: 27px;
        border-radius: 50% 50% 46% 46%;
      }

      .pawcream-splash__title {
        margin: 0;
        color: #63849a;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: .045em;
      }

      .pawcream-splash__status {
        min-height: 22px;
        margin: 9px 0 17px;
        color: #8aa4b5;
        font-size: 12px;
        letter-spacing: .055em;
      }

      .pawcream-splash__track {
        position: relative;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(133, 171, 193, .16);
      }

      .pawcream-splash__progress {
        position: absolute;
        inset: 0 auto 0 0;
        width: 4%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(126, 168, 192, .54), rgba(210, 157, 181, .55));
        transition: width 220ms ease;
      }

      .pawcream-splash__percent {
        display: block;
        margin-top: 8px;
        color: rgba(112, 143, 162, .68);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        letter-spacing: .08em;
      }

      @keyframes pawcream-splash-breathe {
        0%, 100% { transform: translateY(0) scale(.98); opacity: .74; }
        50% { transform: translateY(-3px) scale(1.035); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #pawcream-splash,
        .pawcream-splash__progress {
          transition: none;
        }
        .pawcream-splash__paw {
          animation: none;
        }
      }
    </style>
    <link rel="preload" href="%BASE_URL%assets/font/pawcream-cn.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%assets/font/pawcream-en.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%BASE_URL%instax-fixed-stage.css" />
    <link rel="stylesheet" href="%BASE_URL%font-final-overrides.css?v=a6fb009d" />
    <link rel="stylesheet" href="%BASE_URL%english-plus2.css?v=d72afc6e" />
    <link rel="stylesheet" href="%BASE_URL%note-final.css?v=9c0c397e" />
    <link rel="stylesheet" href="%BASE_URL%atelier-guides.css?v=ba1c039e" />
    <link rel="stylesheet" href="%BASE_URL%click-guide-final.css?v=da240c76" />
    <link rel="stylesheet" href="%BASE_URL%toolbar-final.css?v=9242a82b" />
    <link rel="stylesheet" href="%BASE_URL%letter-tune-readable.css?v=1" />
    <title>PawCream</title>
  </head>
  <body>
    <div id="pawcream-splash" role="status" aria-live="polite" aria-label="PawCream loading">
      <div class="pawcream-splash__inner">
        <div class="pawcream-splash__paw" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
        <p class="pawcream-splash__title">PawCream</p>
        <p class="pawcream-splash__status" data-pawcream-splash-status>preparing your little room...</p>
        <div class="pawcream-splash__track" aria-hidden="true">
          <div class="pawcream-splash__progress" data-pawcream-splash-progress></div>
        </div>
        <span class="pawcream-splash__percent" data-pawcream-splash-percent>0%</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/atelierInstaxPreload.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/pawcreamFonts.ts"></script>
    <script type="module" src="/src/atelierAlphaHit.ts"></script>
    <script type="module" src="/src/atelierGuides.ts"></script>
  </body>
</html>
