:#344f60;font-size:20px}.nav div{display:flex;gap:7px}.ambient{position:absolute;top:24%;width:100%;text-align:center;font-size:11px;letter-spacing:.18em;color:#8aa6b8;opacity:.7}.scene{position:absolute;left:0;right:0;top:39%;width:100%;aspect-ratio:4/3;filter:drop-shadow(0 15px 20px #526f8520)}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.back{z-index:1}.front{z-index:4}.wrap{position:absolute;z-index:2;transform-origin:50% 84%}.paper{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}.copyarea{position:absolute;z-index:2;overflow:hidden;color:#5b798f;font-family:PawCN,PawEN,sans-serif;pointer-events:none}.title{position:absolute;margin:0;text-align:center;overflow:hidden;color:#527792;font-weight:400;line-height:1.28}.signature{position:absolute;overflow:hidden;margin:0;text-align:center;color:#88a2b5;font-family:PawEN,sans-serif;letter-spacing:.04em;line-height:1.35;white-space:nowrap}.bodytext{position:absolute;margin:0;overflow:hidden;color:#648198;letter-spacing:.012em;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}.close{position:absolute;z-index:8;right:8%;top:4%;width:34px;height:34px;border-radius:50%;border:1px solid #cbdfea;background:#ffffffed;color:#7293aa;font-size:24px}.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:5px;background:#111}.note{width:100%;border-radius:12px;background:#f5f9fc;padding:10px 12px;font-size:12px;color:#7893a8;line-height:1.6}.controls{min-width:0}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.profiles{display:flex;gap:7px;flex-wrap:wrap}.profiles button{border:1px solid #c9dce9;background:#fff;color:#527590;border-radius:9px;padding:8px 11px;cursor:pointer}.profiles button.active{background:#dceef9;border-color:#9fc5df}fieldset{border:1px solid #d6e6f1;border-radius:13px;margin:12px 0;padding:10px 12px 12px;min-width:0}legend{padding:0 6px;font-size:12px;color:#7194ad}.control{display:grid;grid-template-columns:minmax(100px,1fr) minmax(100px,1.5fr) 68px 14px;gap:8px;align-items:center;margin:9px 0;font-size:12px;color:#64849c}.control input[type=range]{width:100%;accent-color:#1681f5}.control input[type=number]{width:100%;min-width:0;border:1px solid #cfdfeb;border-radius:8px;padding:6px;color:#426985;background:#fbfdff}.unit{color:#9ab1c1}.stickyactions{position:sticky;bottom:0;padding:12px 0 2px;background:linear-gradient(#ffffffdd,#fff 18%);display:flex;gap:7px;flex-wrap:wrap}.statusline{font-size:12px;color:#a8755c;min-height:18px;margin-top:8px}

<header class="top"><div class="brand">PawCream <small>品牌理念介绍 · 独立调试实验室</small></div><div class="actions"><button class="btn" id="copy">复制当前参数</button><button class="btn primary" id="save">保存参数</button></div></header>
<main class="layout"><section class="card preview"><h2 class="heading">手机实时预览</h2><div class="actions"><button class="btn active" id="deviceMobile">手机尺寸</button><button class="btn" id="deviceDesktop">桌面尺寸</button><button class="btn active" id="langZh">中文</button><button class="btn" id="langEn">English</button></div>
<div class="phone" id="phone"><div class="screen"><div class="status"><span>18:42</span><span>▮▮▮ ◉ ▰</span></div><div class="nav"><span>‹</span><div><span>↗</span><span>···</span></div></div><div class="ambient">PAWCREAM ATELIER</div>
<div class="scene" id="scene"><img class="layer back" src="../assets/envelop/back.png" alt=""><div class="wrap" id="wrap"><img class="paper" id="paper" src="../assets/envelop/paper.png" alt=""><div class="copyarea" id="copyarea"><h2 class="title" id="title"></h2><div class="signature" id="signature">soft things · slow days · little keepsakes</div><p class="bodytext" id="body"></p></div></div><img class="layer front" src="../assets/envelop/front.png" alt=""></div><button class="close">×</button><div class="homebar"></div></div></div>
<p class="note">左侧模拟手机外观，右侧参数独立调节。修改立即反映在预览中；纸张横向拉伸与高度分别控制。</p><div class="actions"><button class="btn" id="start">预览开始</button><button class="btn" id="end">预览结束</button><button class="btn" id="replay">重新播放</button></div></section>
<section class="card controls"><div class="headrow"><h2 class="heading">外置调试面板</h2><div class="profiles"><button id="profileMobile" class="active">Mobile 参数</button><button id="profileDesktop">Desktop 参数</button></div></div><p class="hint">滑块与数字框双向同步。切换参数组不会遮挡或缩小手机预览。</p><div id="controls"></div><div class="stickyactions"><button class="btn" id="reset">重置当前设备</button><button class="btn" id="restore">恢复已保存参数</button><button class="btn" id="copyAll">复制全部参数</button></div><div class="statusline" id="status">当前参数尚未保存</div></section></main>
<script>
const defaults={
desktop:{paperLeft:11.5,paperTop:-20,paperWidth:82,paperHeight:86,paperScale:.88,paperStretchX:1,paperRotate:0,startY:35,endY:9,textLeft:18,textTop:13,textWidth:64,textHeight:54,titleLeft:0,titleTop:0,titleWidth:100,titleHeight:18,titleSize:31.5,zhBodyLeft:0,zhBodyTop:29,zhBodyWidth:100,zhBodyHeight:64,zhBodySize:18.5,enBodyLeft:0,enBodyTop:29,enBodyWidth:100,enBodyHeight:64,enBodySize:18.5,bodyLineHeight:1.76,subtitleLeft:0,subtitleTop:18,subtitleWidth:100,subtitleHeight:10,subtitleSize:21.5,riseMs:4000,typeGapMs:30,typeDelayZh:58,typeDelayEn:32},
mobile:{paperLeft:14,paperTop:5.5,paperWidth:75.5,paperHeight:84,paperScale:.88,paperStretchX:.88,paperRotate:0,startY:5,endY:-16,textLeft:9.8,textTop:13,textWidth:83.9,textHeight:77,titleLeft:0,titleTop:0,titleWidth:100,titleHeight:18,titleSize:22,zhBodyLeft:0,zhBodyTop:29,zhBodyWidth:100,zhBodyHeight:64,zhBodySize:12,enBodyLeft:0,enBodyTop:29,enBodyWidth:100,enBodyHeight:64,enBodySize:12,bodyLineHeight:1.14,subtitleLeft:0,subtitleTop:18,subtitleWidth:100,subtitleHeight:10,subtitleSize:12,riseMs:1550,typeGapMs:30,typeDelayZh:58,typeDelayEn:32}};
const groups=[
["纸张 · 宽度、高度与位置",[["paperLeft","纸张左侧",0,40,.5,"%"],["paperTop","纸张顶部",-20,40,.5,"%"],["paperWidth","纸张区域宽度",40,110,.5,"%"],["paperHeight","纸张高度",35,110,.5,"%"],["paperStretchX","纸张横向拉伸",.6,1.8,.01,"×"],["paperScale","整体缩放",.5,1.3,.01,"×"],["paperRotate","纸张旋转",-12,12,.5,"°"],["startY","起始位置 Y",-40,50,.5,"%"],["endY","结束位置 Y",-40,30,.5,"%"]]],
["文字区 · 整体",[["textLeft","文字区左侧",0,35,.5,"%"],["textTop","文字区顶部",0,45,.5,"%"],["textWidth","文字区宽度",30,100,.5,"%"],["textHeight","文字区高度",20,100,.5,"%"],["bodyLineHeight","正文行高",.8,2.2,.02,"×"]]],
["标题 · 大小与位置",[["titleLeft","标题左侧",-20,30,.5,"%"],["titleTop","标题顶部",-10,40,.5,"%"],["titleWidth","标题宽度",40,140,1,"%"],["titleHeight","标题高度",5,35,.5,"%"],["titleSize","标题字号",8,40,.5,"px"]]],
["中文正文",[["zhBodyLeft","中文左侧",-10,30,.5,"%"],["zhBodyTop","中文顶部",0,80,.5,"%"],["zhBodyWidth","中文宽度",40,130,.5,"%"],["zhBodyHeight","中文高度",10,90,.5,"%"],["zhBodySize","中文字体大小",5,24,.5,"px"]]],
["英文正文",[["enBodyLeft","英文左侧",-10,30,.5,"%"],["enBodyTop","英文顶部",0,80,.5,"%"],["enBodyWidth","英文宽度",40,130,.5,"%"],["enBodyHeight","英文高度",10,90,.5,"%"],["enBodySize","英文字体大小",5,24,.5,"px"]]],
["副标题",[["subtitleLeft","副标题左侧",-10,30,.5,"%"],["subtitleTop","副标题顶部",0,40,.5,"%"],["subtitleWidth","副标题宽度",40,130,.5,"%"],["subtitleHeight","副标题高度",4,20,.5,"%"],["subtitleSize","副标题字号",4,24,.5,"px"]]],
["动画参数",[["riseMs","信纸升起时长",0,5000,50,"ms"],["typeGapMs","打字前等待",0,500,10,"ms"],["typeDelayZh","中文打字间隔",10,200,1,"ms"],["typeDelayEn","英文打字间隔",10,200,1,"ms"]]]];
const copyText={zh:{title:"关于 PawCream",body:"PawCream 是一间收集柔软日常的小小工作室。我们喜欢纸张、照片、旧物和那些来不及一下子说完的话，也相信每一点细小心情，都值得被温柔保存。希望你来到这里时，可以慢一点，也留下属于自己的痕迹。"},en:{title:"About PawCream",body:"PawCream is a tiny atelier for soft everyday moments. We love paper, photographs, old objects, and thoughts that do not need to be said all at once. We believe even the smallest feelings deserve to be kept gently. We hope this little room lets you slow down and leave a trace of your own."}};
let profile="mobile",language="zh",preview="end",values=JSON.parse(JSON.stringify(defaults));
function readSaved(){try{return JSON.parse(localStorage.getItem("pawcream-letter-lab-v1"))}catch(e){return null}}
const prior=readSaved();if(prior)for(const p of ["mobile","desktop"])if(prior[p])values[p]=Object.assign({},values[p],prior[p]);
const $=id=>document.getElementById(id);
function renderControls(){const root=$("controls");root.innerHTML="";groups.forEach(g=>{const fs=document.createElement("fieldset"),legend=document.createElement("legend");legend.textContent=g[0];fs.append(legend);g[1].forEach(item=>{const key=item[0],row=document.createElement("label");row.className="control";const name=document.createElement("span");name.textContent=item[1];const range=document.createElement("input");range.type="range";range.min=item[2];range.max=item[3];range.step=item[4];range.value=values[profile][key];range.dataset.key=key;const num=document.createElement("input");num.type="number";num.min=item[2];num.max=item[3];num.step=item[4];num.value=values[profile][key];num.dataset.key=key;const unit=document.createElement("span");unit.className="unit";unit.textContent=item[5];range.oninput=()=>update(key,Number(range.value));num.onchange=()=>update(key,Number(num.value));row.append(name,range,num,unit);fs.append(row)});root.append(fs)})}
function update(key,v){if(!Number.isFinite(v))return;const item=groups.flatMap(g=>g[1]).find(x=>x[0]===key);v=Math.max(item[2],Math.min(item[3],v));values[profile][key]=v;const inputs=$("controls").querySelectorAll("input[data-key]");inputs.forEach(x=>{if(x.dataset.key===key)x.value=v});draw();$("status").textContent="有未保存的修改"}
function draw(){const t=values[profile],txt=copyText[language],wrap=$("wrap"),copy=$("copyarea"),title=$("title"),sig=$("signature"),body=$("body");$("scene").style.top=profile==="mobile"?"39%":"38%";wrap.style.left=t.paperLeft+"%";wrap.style.top=t.paperTop+"%";wrap.style.width=t.paperWidth+"%";wrap.style.height=t.paperHeight+"%";wrap.style.transform="translate3d(0,"+(preview==="start"?t.startY:t.endY)+"%,0) rotate("+t.paperRotate+"deg) scale("+t.paperScale+")";$("paper").style.transform="scaleX("+t.paperStretchX+")";copy.style.left=t.textLeft+"%";copy.style.top=t.textTop+"%";copy.style.width=t.textWidth+"%";copy.style.height=t.textHeight+"%";copy.style.fontFamily=language==="zh"?"PawCN,PawEN,sans-serif":"PawEN,sans-serif";title.textContent=txt.title;title.style.left=t.titleLeft+"%";title.style.top=t.titleTop+"%";title.style.width=t.titleWidth+"%";title.style.height=t.titleHeight+"%";title.style.fontSize=t.titleSize+"px";sig.style.left=t.subtitleLeft+"%";sig.style.top=t.subtitleTop+"%";sig.style.width=t.subtitleWidth+"%";sig.style.height=t.subtitleHeight+"%";sig.style.fontSize=t.subtitleSize+"px";body.textContent=txt.body;body.style.left=(language==="zh"?t.zhBodyLeft:t.enBodyLeft)+"%";body.style.top=(language==="zh"?t.zhBodyTop:t.enBodyTop)+"%";body.style.width=(language==="zh"?t.zhBodyWidth:t.enBodyWidth)+"%";body.style.height=(language==="zh"?t.zhBodyHeight:t.enBodyHeight)+"%";body.style.fontSize=(language==="zh"?t.zhBodySize:t.enBodySize)+"px";body.style.lineHeight=t.bodyLineHeight;["deviceMobile","profileMobile"].forEach(id=>$(id).classList.toggle("active",profile==="mobile"));["deviceDesktop","profileDesktop"].forEach(id=>$(id).classList.toggle("active",profile==="desktop"));$("langZh").classList.toggle("active",language==="zh");$("langEn").classList.toggle("active",language==="en")}
function switchProfile(p){profile=p;renderControls();draw()}
function save(){localStorage.setItem("pawcream-letter-lab-v1",JSON.stringify(values));$("status").textContent="参数已保存到当前浏览器"}
function copyData(all){const text=JSON.stringify(all?values:{profile:profile,parameters:values[profile]},null,2);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>$("status").textContent="参数已复制").catch(()=>prompt("复制参数",text));else prompt("复制参数",text)}
$("deviceMobile").onclick=()=>switchProfile("mobile");$("deviceDesktop").onclick=()=>switchProfile("desktop");$("profileMobile").onclick=()=>switchProfile("mobile");$("profileDesktop").onclick=()=>switchProfile("desktop");$("langZh").onclick=()=>{language="zh";draw()};$("langEn").onclick=()=>{language="en";draw()};$("start").onclick=()=>{preview="start";draw()};$("end").onclick=()=>{preview="end";draw()};$("replay").onclick=()=>{preview="start";draw();setTimeout(()=>{preview="end";draw()},values[profile].riseMs)};$("save").onclick=save;$("copy").onclick=()=>copyData(false);$("copyAll").onclick=()=>copyData(true);$("restore").onclick=()=>{const v=readSaved();if(v)for(const p of ["mobile","desktop"])values[p]=Object.assign({},defaults[p],v[p]||{});renderControls();draw();$("status").textContent=v?"已恢复上次保存的参数":"当前浏览器没有已保存参数"};$("reset").onclick=()=>{values[profile]=Object.assign({},defaults[profile]);renderControls();draw();$("status").textContent="已重置当前设备参数，尚未保存"};renderControls();draw();
</script></body></html>
